<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Kite social card artwork</title>
<style>
  *{box-sizing:border-box}html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#fff;color:#233e34;font-family:Arial,Helvetica,sans-serif}
  main{height:630px;padding:58px 64px;position:relative;isolation:isolate}
  .brand{display:flex;align-items:center;gap:14px;font-size:36px;font-weight:700;letter-spacing:-1.8px}.brand img{width:48px;height:48px;object-fit:contain}
  .label{margin:42px 0 18px;font-size:15px;font-weight:700;letter-spacing:2.5px;color:#72816e;text-transform:uppercase}
  h1{margin:0;font-size:68px;line-height:1.08;letter-spacing:-3.4px;font-weight:700;max-width:740px}
  .description{font-size:22px;line-height:1.5;color:#657360;margin:25px 0 0;max-width:610px}
  .art{position:absolute;right:42px;top:126px;width:360px;height:360px;z-index:-1;display:grid;place-items:center}
  .art:before,.art:after{content:"";position:absolute;border:1px solid #e7eddf;border-radius:50%;width:360px;height:360px}.art:after{width:292px;height:292px;background:#f7faef;border:0;z-index:-1}
  .art img{width:280px;height:320px;object-fit:contain;transform:rotate(8deg)}
  footer{position:absolute;left:64px;right:64px;bottom:42px;padding-top:24px;border-top:1px solid #e6eadf;display:flex;justify-content:space-between;align-items:center;font-size:15px;color:#72816e}
  .edition{color:#233e34;display:flex;align-items:center;gap:9px;font-weight:600}.dot{width:7px;height:7px;border-radius:50%;background:#9abf70}
  .guide h1{font-size:65px;line-height:1.07}.guide .label{margin-top:30px}.guide .description{margin-top:20px;font-size:21px}.guide .art{top:128px;right:56px}
</style>
<main>
  <div class="brand"><img src="../public/kite-mark-transparent-128.png" alt="">kite</div>
  <p class="label" id="label">The Farcaster client</p>
  <h1 id="heading">An open source<br>Farcaster client.</h1>
  <p class="description" id="description">Chronological feeds. Client filters.<br>A little more independence.</p>
  <div class="art"><img src="../public/kite-mark-transparent.png" alt=""></div>
  <footer><span class="edition"><span class="dot"></span><span id="edition">Explore Farcaster with Kite</span></span><span>OPEN SOURCE · MIT LICENSED</span></footer>
</main>
<script>
  if(new URLSearchParams(location.search).get('page')==='guide'){
    document.querySelector('main').className='guide';
    document.querySelector('#label').textContent='A practical guide to Farcaster';
    document.querySelector('#heading').innerHTML='Your node.<br>Your feed.<br>Your rules.';
    document.querySelector('#description').textContent='Run Snapchain and Kite, one step at a time.';
    document.querySelector('#edition').textContent='The Kite guide';
  }
</script>
</html>
